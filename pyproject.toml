[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econometria"
version = "0.1.0"
description = "Sistema de econometria para calculos pessoais e empresariais: regressao, series temporais, dados em painel, escolha discreta, previsao, financas e relatorios automaticos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sandro Junior" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "arch>=6.3",
    "scikit-learn>=1.4",
    "numpy-financial>=1.0",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "XlsxWriter>=3.2",
]

[project.optional-dependencies]
app = ["streamlit>=1.44"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["econometria*"]

[tool.setuptools.package-data]
econometria = ["reports/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
